<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Solo Games - Fun solo games. Coming soon to iOS and Android." />
        <meta name="author" content="Riley Gray" />
        <title>Solo Games</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
        <script src="https://use.fontawesome.com/releases/v5.15.1/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
        <link href="css/bootstrap.css" rel="stylesheet" />
        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNG9SGHV39"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', 'G-PNG9SGHV39');
        </script>
        <style>
            /* Reset sidebar offset from bootstrap.css */
            body {
                padding-left: 0 !important;
                padding-top: 0 !important;
                margin: 0;
                background-color: #1a1a2e;
                color: #f0f0f0;
                font-family: 'Muli', sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hero {
                text-align: center;
                padding: 3rem 1.5rem;
                max-width: 480px;
                width: 100%;
            }

            .app-icon {
                width: 160px;
                height: 160px;
                border-radius: 36px;
                margin-bottom: 1.5rem;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            }

            .app-title {
                font-family: 'Saira Extra Condensed', sans-serif;
                font-size: 3rem;
                font-weight: 700;
                text-transform: uppercase;
                color: #ffffff;
                margin-bottom: 0.5rem;
                letter-spacing: 0.05rem;
            }

            .app-subtitle {
                font-size: 1.1rem;
                color: #b0b8d1;
                margin-bottom: 2.5rem;
            }

            .coming-soon-badge {
                display: inline-block;
                background-color: #2a2a4a;
                border: 1.5px solid #5555aa;
                color: #9999dd;
                font-family: 'Saira Extra Condensed', sans-serif;
                font-size: 1.4rem;
                font-weight: 700;
                letter-spacing: 0.15rem;
                text-transform: uppercase;
                border-radius: 10px;
                padding: 0.6rem 2rem;
            }
        </style>
    </head>
    <body>
        <main class="hero">
            <img src="images/solo.png" alt="Solo Games app icon" class="app-icon" />
            <h1 class="app-title">Solo Games</h1>
            <p class="app-subtitle">A collection of fun single player games</p>

            <div>
                <span class="coming-soon-badge">Coming Soon</span>
            </div>
        </main>
    </body>
</html>
