<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Couple Games - Fun games to play with your partner. Available on iOS and Android." />
        <meta name="author" content="Riley Gray" />
        <title>Couple Games</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
        <script src="https://use.fontawesome.com/releases/v5.15.1/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
        <link href="css/bootstrap.css" rel="stylesheet" />
        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNG9SGHV39"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', 'G-PNG9SGHV39');
        </script>
        <style>
            /* Reset sidebar offset from bootstrap.css */
            body {
                padding-left: 0 !important;
                padding-top: 0 !important;
                margin: 0;
                background-color: #1a1a2e;
                color: #f0f0f0;
                font-family: 'Muli', sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hero {
                text-align: center;
                padding: 3rem 1.5rem;
                max-width: 480px;
                width: 100%;
            }

            .app-icon {
                width: 160px;
                height: 160px;
                border-radius: 36px;
                margin-bottom: 1.5rem;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            }

            .app-title {
                font-family: 'Saira Extra Condensed', sans-serif;
                font-size: 3rem;
                font-weight: 700;
                text-transform: uppercase;
                color: #ffffff;
                margin-bottom: 0.5rem;
                letter-spacing: 0.05rem;
            }

            .app-subtitle {
                font-size: 1.1rem;
                color: #b0b8d1;
                margin-bottom: 2.5rem;
            }

            .store-buttons {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .store-btn {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 0.85rem;
                background-color: #000000;
                color: #ffffff;
                text-decoration: none;
                border-radius: 12px;
                padding: 0.75rem 1.5rem;
                width: 220px;
                border: 1.5px solid #444;
                transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
            }

            .store-btn:hover {
                background-color: #1c1c1c;
                border-color: #888;
                color: #ffffff;
                text-decoration: none;
                transform: translateY(-2px);
            }

            .store-btn i {
                font-size: 2rem;
                flex-shrink: 0;
            }

            .store-btn-text {
                display: flex;
                flex-direction: column;
                text-align: left;
            }

            .store-btn-label {
                font-size: 0.65rem;
                text-transform: uppercase;
                letter-spacing: 0.06rem;
                color: #aaa;
                line-height: 1;
            }

            .store-btn-name {
                font-size: 1.1rem;
                font-weight: 700;
                line-height: 1.3;
            }

            @media (min-width: 480px) {
                .store-buttons {
                    flex-direction: row;
                    justify-content: center;
                }
            }
        </style>
    </head>
    <body>
        <main class="hero">
            <img src="images/featured.png" alt="Couple Games app icon" class="app-icon" />
            <h1 class="app-title">Couple Games</h1>
            <p class="app-subtitle">A collection of fun 2 player games</p>

            <div class="store-buttons">
                <a href="https://apps.apple.com/app/id6761193720" class="store-btn" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-apple"></i>
                    <span class="store-btn-text">
                        <span class="store-btn-label">Download on the</span>
                        <span class="store-btn-name">App Store</span>
                    </span>
                </a>

                <a href="https://play.google.com/store/apps/details?id=com.realgamesrealfun.couplegames" class="store-btn" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-google-play"></i>
                    <span class="store-btn-text">
                        <span class="store-btn-label">Get it on</span>
                        <span class="store-btn-name">Google Play</span>
                    </span>
                </a>
            </div>
        </main>
    </body>
</html>
